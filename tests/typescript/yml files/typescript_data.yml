to compile TypeScript files to JavaScript and execute the compiled JavaScript file
tsc filename.ts   ->compiles filename.ts to filename.js
node ilename.js   -> executes the compiled JavaScript file

To run the TypeScript file directly:
npx tsx filename.ts


npm install -g typescript
or
npm install -D typescript@5.8.3 ts-node@10.9.2 @types/node

step 1:
npm unistall -D typescript@5.8.3 ts-node@10.9.2 @types/node
or
npm uninstall -g typescript

step 2:
npm install -g typescript@5.9

tsc -v

ts config file:
{
  "compilerOptions": {
    "target": "ES2020",
    "module": "commonjs",
    "strict": true,
    "esModuleInterop": true,
    "moduleResolution": "node",
    "skipLibCheck": true,
    "ignoreDeprecations": "6.0",
    "types": ["node"] ,
    "resolveJsonModule": true
  }
}


